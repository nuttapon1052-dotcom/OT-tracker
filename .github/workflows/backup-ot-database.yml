name: Encrypted OT database backup
on:
  push:
    branches: [main]
    paths:
      - "scripts/backup-ot-database.sh"
      - "scripts/prepare_backup_url.py"
      - ".github/workflows/backup-ot-database.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
permissions:
  contents: read
concurrency:
  group: encrypted-ot-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'nuttapon1052-dotcom/OT-tracker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Install only the PostgreSQL client, not the database server. Ubuntu 24.04
      # runners ship an older client and pg_dump must not be older than the server.
      - name: Install PostgreSQL 17 client (PGDG)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | \
            sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Create and verify encrypted snapshot
        env:
          OT_BACKUP_DATABASE_URL: ${{ secrets.OT_BACKUP_DATABASE_URL }}
          OT_BACKUP_ENCRYPTION_KEY: ${{ secrets.OT_BACKUP_ENCRYPTION_KEY }}
        run: bash scripts/backup-ot-database.sh "$RUNNER_TEMP/ot-encrypted-backups"
      - name: Store ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-ot-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ot-encrypted-backups/*.dump.gpg
            ${{ runner.temp }}/ot-encrypted-backups/*.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Report successful upload
        run: echo "Encrypted snapshot uploaded. This contains the complete accumulated OT history at snapshot time; artifact retention is 90 days." >> "$GITHUB_STEP_SUMMARY"
