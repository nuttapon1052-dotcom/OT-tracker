name: Validate cloud sync
on:
  push:
    branches: [codex/cloud-sync-recovery, main, master]
    paths:
      - "js/**"
      - "index.html"
      - "css/**"
      - "icons/**"
      - "manifest.json"
      - "playwright.config.js"
      - "service-worker.js"
      - "supabase/functions/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/backup-ot-database.yml"
      - ".github/workflows/validate-cloud-sync.yml"
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    name: Read-only Supabase schema check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-cloud-schema.js
  browser:
    name: Sync recovery and existing browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/build-i18n.js --check
      - run: node scripts/check-i18n.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --workers=2 --retries=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cloud-sync-browser-results
          path: test-results/
          retention-days: 7
  backup-roundtrip:
    name: Encrypted backup and isolated restore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-ot-backup.sh
